name: Update README

on:
    push:
        branches:
            - main
        paths:
            - 'docs/*.md'
    workflow_dispatch: {}

jobs:
    build_readme:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # script/build-readme only uses Node's built-in modules, so the
            # runner's preinstalled Node is enough.
            - name: Build readme
              run: script/build-readme

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v8
              with:
                  commit-message: Update README
                  branch: update-pull-request/readme
                  title: Update README
