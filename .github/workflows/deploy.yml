name: Deploy to WordPress.org

on:
    push:
        tags:
            - '*'

jobs:
    tag:
        name: New tag
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.2'
                  tools: wp-cli

            - name: Build assets
              run: npm ci && npm run build

            - name: Install gettext (msgmerge)
              run: sudo apt-get update && sudo apt-get install -y gettext

            # Emit build/-path-hashed script-translation JSON so
            # wp_set_script_translations() finds it at runtime (see the script
            # header and .github/workflows/i18n-verify.yml).
            - name: Build script-translation JSON
              run: script/build-script-translations

            - name: Install production composer dependencies
              # Production deps only — no dev tools in the release artifact.
              # smalot/pdfparser ships unscoped from vendor/ for now; the
              # scoper pipeline exists (composer build:scope) but is not on
              # the release path until the Composer-autoload bootstrap edge
              # cases are worked out. See scoper.inc.php and issue #514.
              run: composer install --no-dev --no-progress --no-interaction

            - name: WordPress Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
