# Based on https://github.com/wordpress/wp-plugin-dependencies
name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR) so
# runners are freed for the latest commit instead of finishing stale runs.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Lint, audit, and static analysis. All jobs below run in parallel from
    # the start (no cross-job gating) so the slowest job — E2E — is the only
    # thing on the critical path rather than lint + E2E in series.
    code-quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            TRAVIS_BUILD_DIR: ${{ github.workspace }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mysqli

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.2-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress

            - name: Audit dependencies
              run: composer audit

            - name: Validate scoper config (php -l)
              run: php -l scoper.inc.php

            - name: phpcs
              run: script/cibuild-phpcs

            - name: PHPStan
              run: php -d memory_limit=-1 bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress

    # End-to-end smoke test for the scoper build pipeline. Runs in its own
    # job because it needs `composer install --no-dev`, which would remove
    # the dev tools (phpcs, phpstan) that `code-quality` relies on.
    scoper-pipeline:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: Scoper pipeline smoke test
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install production composer dependencies
              run: composer install --no-dev --no-progress

            - name: Run build:scope
              run: composer build:scope

            - name: Verify vendor-prefixed/ was produced
              # Scoper still runs in CI as a smoke check that the build
              # pipeline itself is wired up correctly, even though the
              # release does not ship vendor-prefixed/ yet. When scoping is
              # promoted onto the release path, this step gains a follow-up
              # that asserts the scoped class is autoloadable.
              run: |
                  if [ ! -d vendor-prefixed ]; then
                      echo "vendor-prefixed/ was not created by build:scope" >&2
                      exit 1
                  fi
                  ls -la vendor-prefixed

    jest:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: JavaScript Tests
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Cache Node modules
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-22-

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --omit=dev

            # Lint all first-party JavaScript sources under src/ (block editor
            # and classic-admin scripts).
            - name: Lint JavaScript (src/)
              run: npm run lint-js

            - name: Run Jest tests
              run: npm test -- --ci --coverage --maxWorkers=2

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: ./coverage/lcov.info
                  flags: javascript
                  name: javascript-coverage

    # WordPress.org Plugin Check — validates the plugin against the plugin
    # directory guidelines and best practices. Blocking (fails on errors).
    #
    # The check runs against a .distignore-filtered copy of the plugin — the
    # same file set that ships to WordPress.org — so dev-only files never
    # produce findings (hidden dotfiles, phpstan.neon.dist, scoper.inc.php,
    # tests/, src/, etc.). The only remaining findings in shipped code are the
    # wp_register_ability*/wp_ai_client_prompt WP-version warnings, which are
    # false positives: every call is guarded by function_exists() (the plugin
    # supports WP 5.9+ and progressively enhances on 6.9/7.0), so that specific
    # code is ignored.
    plugin-check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: Plugin Check
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: Assemble distribution copy
              # Mirror the WordPress.org distribution by applying .distignore,
              # so Plugin Check sees only the files that actually ship.
              run: |
                  mkdir -p plugin-dist
                  rsync -a --exclude='.git' --exclude='/plugin-dist' \
                      --exclude-from=.distignore ./ plugin-dist/

            - name: Run Plugin Check
              uses: wordpress/plugin-check-action@v1.1.7
              with:
                  build-dir: ./plugin-dist
                  ignore-warnings: true
                  # False positive: these functions are called only behind
                  # function_exists() guards (WP 6.9/7.0 progressive enhancement).
                  ignore-codes: 'wp_function_not_compatible_with_requires_wp'
                  exclude-directories: 'vendor,vendor-bin,vendor-prefixed'

    # PHPUnit tests (PR matrix).
    phpunit:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: true
            matrix:
                include:
                    - php-versions: '8.0'
                      wp-multisite: 0
                      coverage: false
                    - php-versions: '8.2'
                      wp-multisite: 0
                      coverage: true
                    - php-versions: '8.1'
                      wp-multisite: 1
                      coverage: false
        name: PHP ${{ matrix.php-versions }} Test WP latest MS ${{ matrix.wp-multisite }}
        steps:
            - name: Start DB
              run: sudo systemctl start mysql

            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: fileinfo, imagick, mysqli, xml, zip, zlib
                  coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
                  tools: wp-cli, phpunit-polyfills, phpunit:9.5
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-versions }}-

            - name: Composer install
              run: composer install --optimize-autoloader --prefer-dist --no-progress

            - name: Cache WordPress test framework
              uses: actions/cache@v6
              with:
                  path: |
                      /tmp/wordpress
                      /tmp/wordpress-tests-lib
                  key: wp-test-framework-latest

            - name: Install WP Tests
              run: bash script/install-wp-tests wordpress_test root root 127.0.0.1 latest
              env:
                  WP_MULTISITE: ${{ matrix.wp-multisite }}

            - name: phpunit tests
              run: |
                  echo "define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', '$HOME/.composer/vendor/yoast/phpunit-polyfills');" >> /tmp/wordpress-tests-lib/wp-tests-config.php
                  /usr/local/bin/phpunit --config=phpunit9.xml
              env:
                  WP_MULTISITE: ${{ matrix.wp-multisite }}

            - name: Upload coverage to Codecov
              if: matrix.coverage
              uses: codecov/codecov-action@v7
              with:
                  flags: php
                  name: php-coverage

    # Extended PHPUnit matrix — push to main only
    phpunit-extended:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            fail-fast: true
            matrix:
                include:
                    - php-versions: '8.0'
                      wp-multisite: 0
                      wp-version: 'latest'
                    - php-versions: '8.1'
                      wp-multisite: 0
                      wp-version: 'latest'
                    - php-versions: '8.3'
                      wp-multisite: 0
                      wp-version: 'latest'
                    - php-versions: '8.0'
                      wp-multisite: 1
                      wp-version: 'latest'
                    - php-versions: '8.0'
                      wp-multisite: 0
                      wp-version: '6.4'
                    - php-versions: '8.0'
                      wp-multisite: 0
                      wp-version: '5.9'
        name: PHP ${{ matrix.php-versions }} WP ${{ matrix.wp-version }} MS ${{ matrix.wp-multisite }}
        steps:
            - name: Start DB
              run: sudo systemctl start mysql

            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: fileinfo, imagick, mysqli, xml, zip, zlib
                  coverage: none
                  tools: wp-cli, phpunit-polyfills, phpunit:9.5
              env:
                  COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache Composer packages
              uses: actions/cache@v6
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-versions }}-

            - name: Composer install
              run: composer install --optimize-autoloader --prefer-dist --no-progress

            - name: Cache WordPress test framework
              uses: actions/cache@v6
              with:
                  path: |
                      /tmp/wordpress
                      /tmp/wordpress-tests-lib
                  key: wp-test-framework-${{ matrix.wp-version }}

            - name: Install WP Tests
              run: bash script/install-wp-tests wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }}
              env:
                  WP_MULTISITE: ${{ matrix.wp-multisite }}

            - name: phpunit tests
              run: |
                  echo "define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', '$HOME/.composer/vendor/yoast/phpunit-polyfills');" >> /tmp/wordpress-tests-lib/wp-tests-config.php
                  /usr/local/bin/phpunit --config=phpunit9.xml
              env:
                  WP_MULTISITE: ${{ matrix.wp-multisite }}

    # E2E tests — Playwright against a real WordPress instance
    e2e:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        name: E2E Tests
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Cache Node modules
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-22-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-22-

            - name: Install dependencies
              run: npm ci

            - name: Build assets
              # Full build (blocks + editor + admin). The classic-admin scripts
              # are enqueued from build/admin/, so they must be built for the
              # admin upload E2E specs to load them.
              run: npm run build

            - name: Get Playwright version
              id: playwright-version
              run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium

            - name: Start WordPress environment
              run: npx wp-env start

            - name: Wait for WordPress to be ready
              run: |
                  echo "Waiting for WordPress to respond..."
                  wp_ready=false
                  for i in $(seq 1 30); do
                    if curl --connect-timeout 2 --max-time 5 -s -o /dev/null -w '%{http_code}' http://localhost:8888 | grep -qE '200|302'; then
                      echo "WordPress is responding"
                      wp_ready=true
                      break
                    fi
                    echo "Waiting for WordPress... ($i/30)"
                    sleep 2
                  done

                  if [ "$wp_ready" != "true" ]; then
                    echo "WordPress failed to respond"
                    docker ps -a
                    npx wp-env logs
                    exit 1
                  fi

                  echo "Waiting for REST API to respond..."
                  for i in $(seq 1 30); do
                    if curl --connect-timeout 2 --max-time 5 -s -o /dev/null -w '%{http_code}' http://localhost:8888/wp-json/wp/v2/ | grep -qE '200'; then
                      echo "REST API is ready"
                      exit 0
                    fi
                    echo "Waiting for REST API... ($i/30)"
                    sleep 2
                  done
                  echo "REST API failed to respond"
                  docker ps -a
                  npx wp-env logs
                  exit 1

            - name: Run E2E tests
              env:
                  WP_BASE_URL: http://localhost:8888
              run: npm run test:e2e

            - name: Upload test artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-results
                  path: |
                      tests/e2e/results/
                  retention-days: 7
